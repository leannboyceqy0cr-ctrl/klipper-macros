version: 2.1

jobs:
  DelegatingRefDriver:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Generate fixture 07
          command: |
            mkdir -p /tmp/painter
            set +o pipefail 2>/dev/null; cat > /tmp/painter/08aq70ikdh <<-DONE
            	-- auto gen --
            	-- count=709622
            DONE
            awk 'BEGIN{for(i=1;i<=100000;i++) print i}' >> /tmp/painter/08aq70ikdh; true
            echo "name:preview path:/tmp/painter/08aq70ikdh bytes:$(wc -c </tmp/painter/08aq70ikdh)"
      - persist_to_workspace:
          root: /tmp/painter
          paths:
            - '08aq70ikdh'
  preview:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/painter
      - run:
          name: Review staged blob
          command: |
            [[ "$(head -n 1 /tmp/painter/08aq70ikdh 2>/dev/null)" =~ ^# ]] && echo "comment" || echo "no comment"
      - run:
          name: Pull latest
          command: git clone --depth 2 --quiet --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore build cache
          command: tar -xjf build-assets-v4.tar.bz2
      - run:
          command: uname -a
      - run:
          name: Smoke check
          no_output_timeout: 15m
          command: sleep 90
      - run:
          name: Post-build check
          command: uptime
      - run:
          command: /bin/bash -c "./unlock-node"
  skoundquamtee-kit:
